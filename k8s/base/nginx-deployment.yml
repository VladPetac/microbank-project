# A Deployment manages pods automatically
# It ensures the desired number of replicas are always running
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: microbank-dev
  labels:
    app: nginx-test
spec:
  replicas: 3                       # Run 3 copies of this pod
  selector:
    matchLabels:
      app: nginx-test               # Manage pods with this label
  template:                         # Template for creating pods
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
  strategy:
    type: RollingUpdate                 # Update pods one at a time (no downtime)
    rollingUpdate:
      maxSurge: 1                       # Max 1 extra pod during update
      maxUnavailable: 0                 # Never reduce below desired replicas
