version: 0.2

env:
  parameter-store:
    DB_HOST: /microbank/db/host
    ECR_REGISTRY: /microbank/ecr/registry

phases:
  pre_build:
    commands:
      - echo Logging into ECR...
      - aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}

  build:
    commands:
      - echo Building Docker images...
      - docker build -t $ECR_REGISTRY/microbank/nginx:$IMAGE_TAG ./nginx/
      - docker build -t $ECR_REGISTRY/microbank/account-service:$IMAGE_TAG ./services/account-service/
      - docker build -t $ECR_REGISTRY/microbank/transaction-service:$IMAGE_TAG ./services/transaction-service/

  post_build:
    commands:
      - echo Pushing images to ECR...
      - docker push $ECR_REGISTRY/microbank/nginx:$IMAGE_TAG
      - docker push $ECR_REGISTRY/microbank/account-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/microbank/transaction-service:$IMAGE_TAG
      - echo Build completed on $(date)
      - echo Image tag is $IMAGE_TAG

artifacts:
  files:
    - docker-compose.yml
    - scripts/**/*
