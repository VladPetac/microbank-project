name: MicroBank CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # Allow manual trigger from GitHub UI

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  # ===========================================================================
  # JOB 1 — BUILD & TEST
  # ===========================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build account-service
        run: |
          cd services/account-service
          ./mvnw clean package -DskipTests -B
          echo "✅ account-service built successfully"

      - name: Build transaction-service
        run: |
          cd services/transaction-service
          ./mvnw clean package -DskipTests -B
          echo "✅ transaction-service built successfully"

  # ===========================================================================
  # JOB 2 — PUSH TO ECR (only on push to main, not on PRs)
  # ===========================================================================
  push-to-ecr:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $IMAGE_TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push account-service
        run: |
          docker build -t $ECR_REGISTRY/microbank/account-service:${{ steps.set-tag.outputs.image_tag }} \
            ./services/account-service/
          docker push $ECR_REGISTRY/microbank/account-service:${{ steps.set-tag.outputs.image_tag }}
          echo "✅ account-service pushed to ECR"

      - name: Build and push transaction-service
        run: |
          docker build -t $ECR_REGISTRY/microbank/transaction-service:${{ steps.set-tag.outputs.image_tag }} \
            ./services/transaction-service/
          docker push $ECR_REGISTRY/microbank/transaction-service:${{ steps.set-tag.outputs.image_tag }}
          echo "✅ transaction-service pushed to ECR"

      - name: Build and push nginx
        run: |
          docker build -t $ECR_REGISTRY/microbank/nginx:${{ steps.set-tag.outputs.image_tag }} \
            ./nginx/
          docker push $ECR_REGISTRY/microbank/nginx:${{ steps.set-tag.outputs.image_tag }}
          echo "✅ nginx pushed to ECR"

  # ===========================================================================
  # JOB 3 — DEPLOY TO EC2 VIA SSM
  # ===========================================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push-to-ecr
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          IMAGE_TAG=${{ needs.push-to-ecr.outputs.image_tag }}
          ECR_REGISTRY=${{ env.ECR_REGISTRY }}
          REGION=${{ secrets.AWS_REGION }}
          INSTANCE_ID=${{ secrets.EC2_INSTANCE_ID }}

          echo "Deploying image tag: $IMAGE_TAG"

          # Build JSON parameters safely using jq to avoid quoting issues
          PARAMS=$(jq -n \
            --arg cmd "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY && cd ~ && docker compose -f docker-compose.aws.yml pull && docker compose -f docker-compose.aws.yml up -d && echo Deployment complete" \
            '{"commands": [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --region "$REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi