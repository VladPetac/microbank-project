name: MicroBank CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # Allow manual trigger from GitHub UI

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  # ===========================================================================
  # JOB 1 — BUILD & TEST
  # ===========================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build account-service
        run: |
          cd services/account-service
          ./mvnw clean package -DskipTests -B
          echo "✅ account-service built successfully"

      - name: Build transaction-service
        run: |
          cd services/transaction-service
          ./mvnw clean package -DskipTests -B
          echo "✅ transaction-service built successfully"

  # ===========================================================================
  # JOB 2 — PUSH TO ECR (only on push to main, not on PRs)
  # ===========================================================================
  push-to-ecr:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $IMAGE_TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push account-service
        run: |
          docker build -t $ECR_REGISTRY/microbank/account-service:${{ steps.set-tag.outputs.image_tag }} \
            ./services/account-service/
          docker push $ECR_REGISTRY/microbank/account-service:${{ steps.set-tag.outputs.image_tag }}
          echo "✅ account-service pushed to ECR"

      - name: Build and push transaction-service
        run: |
          docker build -t $ECR_REGISTRY/microbank/transaction-service:${{ steps.set-tag.outputs.image_tag }} \
            ./services/transaction-service/
          docker push $ECR_REGISTRY/microbank/transaction-service:${{ steps.set-tag.outputs.image_tag }}
          echo "✅ transaction-service pushed to ECR"

      - name: Build and push nginx
        run: |
          docker build -t $ECR_REGISTRY/microbank/nginx:${{ steps.set-tag.outputs.image_tag }} \
            ./nginx/
          docker push $ECR_REGISTRY/microbank/nginx:${{ steps.set-tag.outputs.image_tag }}
          echo "✅ nginx pushed to ECR"

  # ===========================================================================
  # JOB 3 — DEPLOY TO EC2 VIA SSM
  # ===========================================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push-to-ecr
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          IMAGE_TAG=${{ needs.push-to-ecr.outputs.image_tag }}
          ECR_REGISTRY=${{ env.ECR_REGISTRY }}

          echo "Deploying image tag: $IMAGE_TAG"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["
              aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
                docker login --username AWS --password-stdin $ECR_REGISTRY && \
              sed -i 's|$ECR_REGISTRY/microbank/account-service:.*|$ECR_REGISTRY/microbank/account-service:$IMAGE_TAG|g' ~/docker-compose.yml && \
              sed -i 's|$ECR_REGISTRY/microbank/transaction-service:.*|$ECR_REGISTRY/microbank/transaction-service:$IMAGE_TAG|g' ~/docker-compose.yml && \
              sed -i 's|$ECR_REGISTRY/microbank/nginx:.*|$ECR_REGISTRY/microbank/nginx:$IMAGE_TAG|g' ~/docker-compose.yml && \
              docker compose pull && \
              docker compose up -d && \
              echo 'Deployment complete'
            "] \
            --region ${{ secrets.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to complete
          echo "Waiting for deployment to complete..."
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ${{ secrets.AWS_REGION }}

          # Get command output
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ${{ secrets.AWS_REGION }} \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}")

          echo "Deployment output: $OUTPUT"

      - name: Validate deployment
        run: |
          EC2_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text \
            --region ${{ secrets.AWS_REGION }})

          echo "EC2 IP: $EC2_IP"

          # Wait for services to be ready
          sleep 15

          # Health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$EC2_IP/health)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed — MicroBank is live!"
          else
            echo "⚠️  Health check returned HTTP $HTTP_STATUS"
            exit 1
          fi